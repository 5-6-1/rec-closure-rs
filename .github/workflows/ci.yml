name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Enforce 350-line file limit
        shell: bash
        run: |
          for f in $(find src tests -name '*.rs'); do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 350 ]; then
              echo "error: $f has $lines lines (limit 350)"
              exit 1
            fi
          done
      # The README claims these shapes are verified; actually run them.
      - run: cargo run --example optimized
      - run: cargo run --example sync
      - run: cargo run --example nested
      - run: cargo run --example typed

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --all-targets
